<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <h1>Student Marks</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Math</th>
            <th>Science</th>
        </tr>
        <tr>
            <td>Riya</td>
            <td>90</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Arjun</td>
            <td>85</td>
            <td>91</td>
        </tr>
    </table>
</body>
</html>
