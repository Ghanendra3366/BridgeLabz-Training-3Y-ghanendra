<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
</head>
<body>
    <h1>Student Information</h1>
    <form action="#" method="post">
        <label for="student-name">Name:</label><br>
        <input type="text" id="student-name" name="student_name" required><br><br>

        <label for="roll-number">Roll Number:</label><br>
        <input type="text" id="roll-number" name="roll_number" required><br><br>

        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <option value="" selected disabled>Select Course</option>
            <option value="bca">BCA</option>
            <option value="btech">B.Tech</option>
            <option value="bsc">B.Sc</option>
        </select>
    </form>
</body>
</html>
