<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form action="#" method="post">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- A CSRF token is a hidden security value used to verify that the form request comes from the trusted user session and helps prevent cross-site request forgery attacks. -->
        <input type="hidden" name="csrf_token" value="dummy-token-12345">

        <button type="submit">Login</button>
    </form>
</body>
</html>
