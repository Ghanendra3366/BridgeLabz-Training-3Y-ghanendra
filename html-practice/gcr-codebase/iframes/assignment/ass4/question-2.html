<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Map</title>
</head>
<body>
    <!-- The loading="lazy" attribute helps browsers load the map only when needed, improving page performance. -->
    <h1>School Location</h1>
    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        title="Map of Delhi"
        width="80%"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
