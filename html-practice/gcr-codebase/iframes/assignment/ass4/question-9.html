<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
</head>
<body>
    <h1>Upload File</h1>
    <form action="#" method="post">
        <label for="file-upload">Choose a file:</label><br>
        <input type="file" id="file-upload" name="file_upload" accept=".jpg,.png" required>
        <p>Allowed file types: JPG and PNG only.</p>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
