<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-API Dashboard</title><script src="dashboard.js" defer></script><style>body{font-family:Arial,sans-serif;padding:32px;background:#edf3f1}.dashboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{padding:24px;background:white;border:1px solid #ccd8d3}.skeleton{height:38px;background:linear-gradient(90deg,#e7edeb,#f7faf9,#e7edeb);background-size:200% 100%;animation:loading 1s infinite}@keyframes loading{to{background-position:-200% 0}}.warning{color:#9a3c28;font-weight:bold}@media(max-width:700px){.dashboard{grid-template-columns:1fr}}</style></head><body><main><h1>Business Overview</h1><p id="dashboardWarning" class="warning" role="alert"></p><section class="dashboard"><article class="card"><h2>Users</h2><strong id="userCount"><span class="skeleton"></span></strong></article><article class="card"><h2>Orders</h2><strong id="orderCount"><span class="skeleton"></span></strong></article><article class="card"><h2>Products</h2><strong id="productCount"><span class="skeleton"></span></strong></article></section></main></body></html>
