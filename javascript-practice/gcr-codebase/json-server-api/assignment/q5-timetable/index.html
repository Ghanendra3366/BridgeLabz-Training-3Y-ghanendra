<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Timetable</title><script src="timetable.js" defer></script><style>body{font-family:Arial,sans-serif;padding:32px;background:#f3f5f1}.timetable-app{max-width:800px;margin:auto}select{padding:10px}.classes{display:grid;gap:12px;margin-top:18px}.class-card{display:grid;grid-template-columns:1fr 1fr 120px;padding:16px;background:white;border:1px solid #ccd7c9}@media(max-width:600px){.class-card{grid-template-columns:1fr}}</style></head><body><main class="timetable-app"><h1>College Timetable</h1><label for="daySelect">Choose weekday</label><select id="daySelect"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><section id="classList" class="classes"></section></main></body></html>
