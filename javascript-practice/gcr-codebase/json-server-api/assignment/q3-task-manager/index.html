<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="task-manager.js" defer></script><style>body{font-family:Arial,sans-serif;padding:32px;background:#f5f7f8}.task-app{max-width:700px;margin:auto}.task{display:flex;gap:10px;align-items:center;padding:12px;margin:6px 0;background:white;border:1px solid #d0d8da}.task.completed span{text-decoration:line-through;color:#68756f}select{padding:9px}</style></head><body><main class="task-app"><h1>Task Manager</h1><label for="taskFilter">Filter tasks</label><select id="taskFilter"><option value="all">All tasks</option><option value="low">Low Priority</option><option value="medium">Medium Priority</option><option value="high">High Priority</option><option value="completed">Completed</option></select><section id="taskList"></section></main></body></html>
