<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Product Search</title><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="live-search.js" defer></script><style>body{font-family:Arial,sans-serif;background:#f4f7f6;padding:32px}.search-app{max-width:900px;margin:auto}input{width:100%;box-sizing:border-box;padding:14px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:18px}.product{padding:14px;background:#fff;border:1px solid #d6dfdc}.product img{width:100%;height:150px;object-fit:cover}.loading,.empty{text-align:center;padding:24px}</style></head>
<body><main class="search-app"><h1>Find a product</h1><label for="searchInput">Live search</label><input id="searchInput" type="search" placeholder="Type a product name"><p id="loading" class="loading" hidden>Loading products...</p><section id="searchResults" class="results"></section></main></body></html>
