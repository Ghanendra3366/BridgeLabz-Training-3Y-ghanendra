<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Registration</title><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script src="registration.js" defer></script><style>body{font-family:Arial,sans-serif;padding:32px;background:#f2f5f4}form{max-width:520px;margin:auto;padding:24px;background:white}label,input{display:block}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px}button{padding:10px 16px}.message{min-height:24px;font-weight:bold}.error{color:#b42318}.success{color:#1c6e45}</style></head><body><main><form id="registrationForm"><h1>Create account</h1><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button type="submit">Register</button><p id="registrationMessage" class="message" aria-live="polite"></p></form></main></body></html>
