<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Validation</title><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="registration-validation.js" defer></script><style>body{font-family:Arial,sans-serif;padding:30px}form{max-width:520px}label{display:block;margin-top:12px}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #9baaa3;border-radius:5px}.error{min-height:20px;color:#b42318}.success{color:#157347;font-weight:bold}</style></head><body><main><h1>Create account</h1><form id="registrationForm" novalidate><label>Name<input id="name" name="name"></label><p class="error" data-error="name"></p><label>Email<input id="email" name="email" type="email"></label><p class="error" data-error="email"></p><label>Password<input id="password" name="password" type="password"></label><p class="error" data-error="password"></p><button type="submit">Register</button></form><p id="registrationStatus" aria-live="polite"></p></main></body></html>
