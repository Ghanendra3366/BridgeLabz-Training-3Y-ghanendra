<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome Greeting</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="welcome-greeting.js" defer></script>
  <style>body{font-family:Arial,sans-serif;margin:0;background:#edf6f2;color:#17352c}.welcome{max-width:700px;margin:60px auto;padding:32px;background:#fff;border-radius:10px}button{margin:6px;padding:10px 14px}#welcomeMessage{padding:16px;background:#dff2e7;border-radius:6px}</style>
</head>
<body>
  <main class="welcome"><header><h1 id="greeting">Welcome</h1></header><p id="welcomeMessage">We are glad you are here.</p><button id="changeGreeting" type="button">Change Greeting</button><button id="toggleWelcome" type="button">Toggle Welcome</button></main>
</body>
</html>
