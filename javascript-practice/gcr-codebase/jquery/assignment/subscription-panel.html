<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions</title><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="subscription-panel.js" defer></script><style>body{font-family:Arial,sans-serif;padding:30px}.panel{max-width:620px;margin:auto}.topic{display:flex;justify-content:space-between;align-items:center;border:1px solid #ccd4d3;margin:8px 0;padding:12px}.topic.subscribed{background:#def3e7}.message{min-height:24px;color:#197148}button{padding:8px 12px;margin-left:6px}</style></head><body><main class="panel"><h1>Event Subscriptions</h1><button id="subscribeAll" type="button">Subscribe</button><button id="unsubscribeAll" type="button">Unsubscribe</button><form id="topicForm"><label>New topic <input id="newTopic" required></label><button type="submit">Add topic</button></form><section id="topics"><article class="topic" data-topic="Security"><span>Security alerts</span><button class="removeTopic" type="button">Remove</button></article><article class="topic" data-topic="Courses"><span>Course updates</span><button class="removeTopic" type="button">Remove</button></article><article class="topic" data-topic="Offers"><span>Special offers</span><button class="removeTopic" type="button">Remove</button></article><article class="topic" data-topic="Events"><span>Live events</span><button class="removeTopic" type="button">Remove</button></article><article class="topic" data-topic="News"><span>Weekly news</span><button class="removeTopic" type="button">Remove</button></article></section><p class="message" aria-live="polite"></p></main></body></html>
