<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css" />
</head>
<body>
    <section class="q1-page">
        <h1>Borders & Padding</h1>
        <div class="box-row">
            <div class="demo-box box-solid">
                <span>Solid Border</span>
            </div>
            <div class="demo-box box-dashed">
                <span>Dashed Border</span>
            </div>
            <div class="demo-box box-double">
                <span>Double Border</span>
            </div>
            <div class="demo-box box-groove">
                <span>Groove Border</span>
            </div>
        </div>

        <div class="box-row rounded-row">
            <div class="demo-box rounded-one">
                <span>Rounded</span>
            </div>
            <div class="demo-box rounded-two">
                <span>More Rounded</span>
            </div>
        </div>
    </section>
</body>
</html>
