<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css" />
</head>
<body>
    <section class="box-model-demo">
        <div class="box-layer">
            <div class="content-layer">
                <span class="label">Content</span>
                <p>Main content area.</p>
            </div>
        </div>
        <div class="box-model-desc">
            <p>Content is inside the box.</p>
            <p>Padding adds space around the content.</p>
            <p>Border separates the padding from margin.</p>
            <p>Margin is outside the border.</p>
        </div>
    </section>
</body>
</html>
