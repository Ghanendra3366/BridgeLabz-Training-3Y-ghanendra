<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Selectors</title>
    <link rel="stylesheet" href="q5.css" />
</head>
<body>
    <section class="selector-demo">
        <h2>Selector Demo</h2>
        <input type="text" placeholder="Type here" />
        <a href="https://example.com">External Link</a>
        <a href="mailto:test@example.com">Mail Link</a>

        <ul class="item-list">
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
            <li>Fourth Item</li>
            <li>Fifth Item</li>
        </ul>

        <div class="parent">
            <span class="child">Child Item</span>
            <span class="child">Another Child</span>
        </div>
    </section>
</body>
</html>
