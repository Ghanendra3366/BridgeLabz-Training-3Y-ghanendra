<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Sizing Comparison</title>
  <link rel="stylesheet" href="q8.css" />
</head>
<body>
  <section class="box-sizing-demo">
    <div class="box-group">
      <div class="box default-box">
        <h3>Default Box</h3>
        <p>Width includes content only.</p>
      </div>

      <div class="box border-box">
        <h3>Border Box</h3>
        <p>Width includes padding and border.</p>
      </div>
    </div>

    <p class="note">
      Box sizing controls whether padding and border are added inside or outside the declared width.
    </p>
  </section>
</body>
</html>
