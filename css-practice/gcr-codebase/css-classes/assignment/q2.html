<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="q2.css" />
</head>
<body>
  <section class="tooltip-demo">
    <h1>Tooltip Example</h1>
    <div class="tooltip-row">
      <div class="tooltip-area">
        <span class="tooltip-trigger">Hover Me<span class="tooltip">This is a tooltip</span></span>
      </div>

      <div class="tooltip-area">
        <span class="tooltip-trigger">Info<span class="tooltip">Helpful information</span></span>
      </div>

      <div class="tooltip-area">
        <span class="tooltip-trigger">Warning<span class="tooltip">Important notice</span></span>
      </div>
    </div>
  </section>
</body>
</html>
