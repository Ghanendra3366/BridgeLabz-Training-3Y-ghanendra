<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Collection</title>
  <link rel="stylesheet" href="q5.css" />
</head>
<body>
  <section class="button-collection">
    <h1>Styled Buttons</h1>
    <div class="button-row">

      <button class="btn disabled" disabled>Disabled</button>

  </section>
