<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="q10.css" />
</head>
<body>
  <div class="mini-ui">
    <header class="mini-header">
      <div class="logo">Logo</div>
      <nav class="mini-nav">
        <a href="#">Home</a>
        <a href="#">Docs</a>
        <a href="#">Services</a>
      </nav>
    </header>

    <main class="mini-main">
      <section class="main-card">
        <div class="card-image">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="" />
        </div>

        <div class="card-content">
          <h1>UI Card</h1>
          <form class="mini-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
          </form>

          <div class="button-group">
            <button class="card-btn save">Save</button>
            <button class="card-btn cancel">Cancel</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="mini-footer">
      <p>Footer Text</p>
    </footer>
  </div>
</body>
</html>
