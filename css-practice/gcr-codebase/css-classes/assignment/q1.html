<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pseudo-Classes</title>
  <link rel="stylesheet" href="q1.css" />
</head>
<body>
  <section class="pseudo-demo">
    <h1>Pseudo-Classes Showcase</h1>

    <div class="pseudo-row">
      <div class="example">
        <p class="label">Hover Link</p>
        <a class="hover-link" href="#">Hover Me</a>
      </div>

      <div class="example">
        <p class="label">Focus Input</p>
        <input class="focus-input" type="text" placeholder="Focus me" />
      </div>

      <div class="example">
        <p class="label">Active Button</p>
        <button class="active-btn">Click Me</button>
      </div>

      <div class="example">
        <p class="label">List Items</p>
        <ul class="list-demo">
          <li>One</li>
          <li>Two</li>
          <li>Three</li>
          <li>Four</li>
        </ul>
      </div>
    </div>
  </section>
</body>
</html>
