<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5-pricing.css">
</head>
<body>
    <section class="pricing-section">
        <h1>Choose Your Plan</h1>
        <div class="pricing-grid">
            <article class="plan basic">
                <h2>Basic</h2>
                <ul>
                    <li>1 project</li>
                    <li>Email support</li>
                    <li>Basic analytics</li>
                </ul>
                <div class="price">₹499 <span>/month</span></div>
                <a href="#">Get Started</a>
            </article>

            <article class="plan standard popular">
                <h2>Standard</h2>
                <ul>
                    <li>10 projects</li>
                    <li>Priority support</li>
                    <li>Advanced analytics</li>
                </ul>
                <div class="price">₹999 <span>/month</span></div>
                <a href="#">Choose Plan</a>
            </article>

            <article class="plan premium">
                <h2>Premium</h2>
                <ul>
                    <li>Unlimited projects</li>
                    <li>24/7 support</li>
                    <li>Custom dashboards</li>
                </ul>
                <div class="price">₹1,999 <span>/month</span></div>
                <a href="#">Go Premium</a>
            </article>
        </div>
    </section>
</body>
</html>
