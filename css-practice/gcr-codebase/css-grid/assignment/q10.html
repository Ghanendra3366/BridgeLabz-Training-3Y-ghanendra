<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="q10.css" />
</head>
<body>
    <div class="wrapper">
        <header class="site-header">
            <div class="logo">Logo</div>
            <nav class="site-nav">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <main class="main-grid">
            <article class="article">
                <h1 class="fade-title">Welcome to Our Platform</h1>
                <div class="article-boxes">
                    <div class="article-box">Design</div>
                    <div class="article-box">Development</div>
                    <div class="article-box">Strategy</div>
                </div>
            </article>
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>Useful links and resources</p>
            </aside>
        </main>

        <footer class="site-footer">
            <p>Copyright &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
