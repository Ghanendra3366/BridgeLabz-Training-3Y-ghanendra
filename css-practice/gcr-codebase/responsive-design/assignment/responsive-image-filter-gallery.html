<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header class="page-header"><h1>Filter Gallery</h1><p>Six images, six CSS filters.</p></header>
    <main><section class="gallery" aria-label="Filtered image gallery">
        <figure><img class="blur" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
        <figure><img class="grayscale" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" alt="Snowy mountain"><figcaption>Grayscale</figcaption></figure>
        <figure><img class="sepia" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Ocean shore"><figcaption>Sepia</figcaption></figure>
        <figure><img class="brightness" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Forest path"><figcaption>Brightness</figcaption></figure>
        <figure><img class="contrast" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlit forest"><figcaption>Contrast</figcaption></figure>
        <figure><img class="hue" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Green valley"><figcaption>Hue rotate</figcaption></figure>
    </section></main>
</body>
</html>
